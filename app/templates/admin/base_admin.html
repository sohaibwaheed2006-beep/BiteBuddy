{% extends "base.html" %}
{% import "_macros.html" as ui with context %}
{% block title %}Admin — BiteBuddy{% endblock %}

{% block content %}
{% set ep = request.endpoint or '' %}
<div class="flex flex-col lg:flex-row gap-6 items-start">
    <aside class="w-full lg:w-60 flex-shrink-0 lg:sticky lg:top-24">
        <nav class="bb-card p-3 flex lg:flex-col gap-1 overflow-x-auto" aria-label="Admin">
            <p class="hidden lg:block text-[10px] font-black uppercase tracking-[.2em] text-stone-500 px-3 pt-2 pb-3">Admin panel</p>
            <a href="{{ url_for('admin.dashboard') }}" class="bb-admin-link flex-shrink-0 {% if ep == 'admin.dashboard' %}is-active{% endif %}"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="{{ url_for('admin.manage_orders') }}" class="bb-admin-link flex-shrink-0 {% if ep == 'admin.manage_orders' %}is-active{% endif %}"><i class="bi bi-receipt"></i> Orders</a>
            <a href="{{ url_for('admin.manage_items') }}" class="bb-admin-link flex-shrink-0 {% if ep in ['admin.manage_items', 'admin.add_item', 'admin.edit_item'] %}is-active{% endif %}"><i class="bi bi-egg-fried"></i> Menu items</a>
            <a href="{{ url_for('admin.manage_categories') }}" class="bb-admin-link flex-shrink-0 {% if ep == 'admin.manage_categories' %}is-active{% endif %}"><i class="bi bi-tags-fill"></i> Categories</a>
            <div class="hidden lg:block bb-divider my-2"></div>
            <a href="{{ url_for('main.home') }}" class="bb-admin-link flex-shrink-0"><i class="bi bi-box-arrow-up-right"></i> View site</a>
        </nav>
    </aside>
    <div class="flex-1 min-w-0 w-full">
        {% block admin_content %}{% endblock %}
    </div>
</div>
{% endblock %}
