{# Left-hand photo panel shared by the login and register pages. Expects `headline` and `sub`. #}
<div class="bb-auth__stage">
    <img src="{{ asset('images/auth_panel.jpg') }}" alt="" aria-hidden="true">
    <div class="flex items-center justify-between gap-2">
        <span class="bb-chip"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Kitchen open now</span>
        <span class="bb-chip bb-chip--gold"><i class="bi bi-star-fill"></i> 4.9 rated</span>
    </div>
    <div class="relative max-w-sm mt-auto pt-40 lg:pt-0">
        <h2 class="font-display font-extrabold text-3xl md:text-4xl leading-[1.08] tracking-tight">{{ headline|safe }}</h2>
        <p class="text-sm text-white/80 mt-3 leading-relaxed">{{ sub }}</p>
        <div class="flex flex-col gap-3 mt-6">
            <span class="bb-perk"><i class="bi bi-stopwatch"></i> Hot to your door in about 30 minutes</span>
            <span class="bb-perk"><i class="bi bi-geo-alt"></i> Live order tracking, every step</span>
            <span class="bb-perk"><i class="bi bi-shield-check"></i> Cash on delivery or secure card</span>
        </div>
    </div>
</div>
